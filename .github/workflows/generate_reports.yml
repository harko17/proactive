name: Generate New Relic Market Reports

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate New Relic Report
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          TETRIS_API_KEY: ${{ secrets.TETRIS_API_KEY }}
          OUTPUT_DIR: output
        run: |
          mkdir -p output
          rm -f output/*.xlsx output/overall_report.md
          python -m app.newrelic_client

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newrelic-market-reports
          path: |
            output/*.xlsx
          if-no-files-found: warn
          retention-days: 30

      - name: Commit and push report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force output/*.xlsx
          if git diff --cached --quiet; then
            echo "Report is unchanged; nothing to commit."
          else
            git commit -m "Update New Relic market reports - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
